id: 1
title: "Как приручить пантеру"
description: |
  Заблудившись в диких джунглях,
  вы сталкиваетесь лицом к лицу с грозной чёрной пантерой.

  Хищник внимательно следит за каждым вашим движением,
  решая, кто вы для него — угроза, добыча или нечто большее.

  Сумеете ли вы завоевать доверие могучего зверя
  и обрести неожиданного союзника?

firstStepId: 1

steps:

  - id: 1
    result: CONTINUE
    text: |
      Дождь только что закончился.

      Ты приходишь в себя на мокрой земле посреди джунглей.
      Последнее, что ты помнишь — скользкий склон,
      крик кого-то из команды и стремительное падение вниз.

      Теперь вокруг тихо.
      Слишком тихо.

      Команды рядом нет.
      Рация молчит.

      Нога немного ноет, в голове шумит,
      но тебе повезло — кажется, ничего не сломано.

      Ты медленно поднимаешься и вдруг замечаешь
      в кустах два огромных жёлтых глаза.

      Ты замираешь.

      В одной руке у тебя охотничий нож.
      В другой — кусок вяленого мяса из походного пайка.

      Пантера не двигается.
      Она просто смотрит на тебя.

    choices:
      - id: 1
        text: "Сжать нож крепче и напасть первым"
        nextStepId: 2

      - id: 2
        text: "Медленно положить мясо на землю и отступить"
        nextStepId: 3

  - id: 2
    result: LOSE
    text: |
      Ты бросаешься вперёд с ножом.

      Пантера оказывается быстрее.

      Одно мгновение —
      и огромная чёрная тень сбивает тебя с ног.

      Джунгли снова становятся тихими.

      Ты проиграл.

    choices:
      - id: 3
        text: "Начать сначала"
        nextStepId: 1

  - id: 3
    result: WIN
    text: |
      Ты медленно кладёшь мясо на землю
      и делаешь несколько шагов назад.

      Пантера выходит из кустов.

      Огромная.
      Бесшумная.
      Опасная.

      Она осторожно берёт мясо
      и внимательно смотрит на тебя.

      В её взгляде больше нет угрозы.

      Кажется, ты сделал первый шаг к доверию.

      Ты победил.

    choices:
      - id: 4
        text: "Начать сначала"
        nextStepId: 1