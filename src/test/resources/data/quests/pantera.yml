id: 1
title: "Как приручить пантеру"
description: |
  Заблудившись в диких джунглях,
  ты сталкиваешься лицом к лицу с грозной чёрной пантерой.
  Хищник внимательно следит за каждым твоим движением,
  решая, кто ты для него — угроза, добыча или нечто большее.
  Сумеешь ли ты завоевать доверие могучего зверя
  и обрести неожиданного союзника?

firstStepId: 1

steps:

  - id: 1
    result: CONTINUE
    text: |
      Дождь только что закончился.
      Ты приходишь в себя на мокрой земле посреди джунглей.
      Последнее, что ты помнишь — скользкий склон, крик кого-то из команды и стремительное падение вниз.
      Никого рядом нет. Рация молчит.
      Нога немного ноет, но, кажется, ничего не сломано.
      Ты оглядываешься.
      Рядом разбросаны твои вещи,а неподалеку мокнет раскрытый рюкзак.
      Ты медленно поднимаешься и начинаешь собирать свои вещи.
      Фляга, аптечка, охотничий нож...
      Чуть дальше замечаешь упаковку сухпайка.
      Ты тянешься за ней и вдруг замираешь.
      Из тёмных зарослей на тебя смотрят два огромных жёлтых глаза.
      Чёрная пантера.
      В одной руке у тебя нож. В другой — кусок вяленого мяса.
      Пантера не двигается.
      Она внимательно наблюдает за тобой.

    choices:
      - id: 1
        text: "Сжать нож крепче и напасть первой"
        nextStepId: 2

      - id: 2
        text: "Положить мясо на землю и отступить"
        nextStepId: 3

  - id: 2
    result: LOSE
    text: |
      Ты бросаешься вперёд с ножом.
      Пантера оказывается быстрее.
      Одно мгновение — и огромная чёрная тень сбивает тебя с ног.
      Джунгли снова становятся тихими.
      Ты проиграла.

  - id: 3
    result: CONTINUE
    text: |
      Ты медленно кладёшь мясо на землю и делаешь несколько шагов назад.
      Пантера пристально смотрит на тебя.
      Ветер приносит запах еды, и её взгляд на мгновение скользит к мясу.
      Пантера принюхивается и медленно выходит из кустов.
      Огромная. Бесшумная. Опасная.
      Только сейчас ты замечаешь потёртый кожаный ошейник на её шее.
      ...Когда-то эта пантера жила рядом с людьми?..
      Издавая недоверчивое рычание, она осторожно приближается к добыче.
      Схватив мясо, пантера отступает назад и одним прыжком скрывается в зарослях.

    choices:
      - id: 4
        text: "Замереть"
        nextStepId: 4

      - id: 5
        text: "Побежать за пантерой"
        nextStepId: 5

  - id: 5
    result: LOSE
    text: |
      Ты бросаешься вслед за пантерой.
      Хищник мгновенно реагирует на угрозу.
      И прежде чем ты успеваешь остановиться, острые клыки впиваются тебе в грудь.
      Джунгли расплываются перед глазами.
      Кажется, это было не самое удачное решение.
      Твой путь окончен.
      Ты проиграла.

  - id: 4
    result: CONTINUE
    text: |
      Ты замираешь в оцепенении.
      Несколько минут не можешь даже пошевелиться.
      Твой слух обостряется: шорох листьев, крики птиц, треск веток где-то вдалеке.
      Кажется, ты даже слышишь, как кровь вязко движется по твоим венам.
      Наконец ты начинаешь дышать.
      Пантера больше не появляется.
      Ты возвращаешься к своим вещам и заканчиваешь собирать рюкзак.
      Мысль о хищниках не даёт покоя.
      Если здесь была пантера, кто ещё скрывается в этих джунглях?
      Ты поднимаешь голову к небу.
      Судя по солнцу, сейчас около трёх часов дня.
      До лагеря не меньше десяти часов пути.
      До темноты точно не успеть.
      Значит, сегодня придётся ночевать в джунглях.

    choices:
    - id: 6
      text: "Осмотреться и выбрать место для лагеря"
      nextStepId: 6

    - id: 7
      text: "Попытаться добраться до лагеря до темноты"
      nextStepId: 7

  - id: 7
    result: LOSE
    text: |
      Несмотря на приближающуюся ночь, ты решаешь продолжить путь к лагерю.
      Первое время кажется, что план работает.
      Но солнце быстро скрывается за верхушками деревьев.
      Джунгли погружаются во тьму.
      Ветки хлещут тебя по лицу.
      Корни то и дело цепляются за ноги.
      Ты всё чаще спотыкаешься и сбиваешься с пути.
      Устав от изнеможения, ты понимаешь, что дальше уже не сможешь идти.
      Как вдруг...
      Внезапно пара клыков, сверкнув словно молния, обрывает твой путь.
      Ты проиграла.

  - id: 6
    result: CONTINUE
    text: |
      Ты решаешь не испытывать судьбу и заняться поиском места для ночлега.
      До заката остаётся совсем немного времени.
      Побродив по джунглям, ты натыкаешься на ручей с пресной водой.
      Рядом растёт небольшое дерево, под которым можно уютно укрыться на ночь.
      Ты наклоняешься к ручью, чтобы пополнить запасы воды.
      И тут замечаешь следы.
      Много следов: одни совсем маленькие, другие размером с твою ладонь.
      Но вдруг твой взгляд останавливается.
      Ты видишь чёткий отпечаток кошачьей лапы.
      Его внушительные размеры заставляют сердце биться быстрее, а адреналин вновь разливается по твоим венам.
      И судя по отпечатку, оставлен он совсем недавно.
      Времени остаётся всё меньше.
      Вдали ты замечаешь небольшой холм.
      Но чтобы добраться до него, придётся потратить ещё как минимум полчаса.
      На мгновение ты теряешься.
      Но, глубоко вздохнув, принимаешь решение.

    choices:
      - id: 9
        text: "Разбить лагерь у ручья"
        nextStepId: 8

      - id: 10
        text: "Отправиться к холму"
        nextStepId: 9

  - id: 8
    result: LOSE
    text: |
      Ты решаешь разбить лагерь у ручья.
      Под деревом оказывается сухо и даже немного уютно.
      Закончив приготовления, ты устраиваешься на ночлег.
      Но среди ночи тебя будит раскат грома.
      Начинается сильный ливень.
      Всего за несколько минут ручей превращается в бурлящий поток.
      Вода стремительно прибывает.
      Ты хватаешь рюкзак и пытаешься выбраться на возвышенность.
      В темноте нога соскальзывает с мокрого камня.
      Ты падаешь прямо в воду.
      Течение мгновенно подхватывает тебя и тащит вниз.
      Последнее, что ты видишь — мутную воду и летящие во все стороны комья грязи.
      Похоже, разбить лагерь у воды было не самым лучшим решением.
      Ты проиграла.
  - id: 9
    result: CONTINUE
    text: |
      Ты решаешь отправиться к холму.
      Подъём оказывается тяжелее, чем казалось.
      К тому моменту, когда ты добираешься до вершины, последние лучи солнца уже скрываются за горизонтом.
      Не теряя времени, ты принимаешься за работу.
      Сначала расчищаешь небольшой участок земли от веток и сухой листвы.
      Затем находишь несколько длинных веток и сооружаешь простейший навес.
      Под него ты набрасываешь толстый слой листвы.
      В голове вдруг всплывает:
      "Настил — минимум двадцать сантиметров".
      Кажется, ты вычитала это в каком-то затёртом журнале о путешествиях много лет назад.
      К счастью, в рюкзаке находится зажигалка.
      Совсем скоро перед укрытием потрескивает небольшой костёр.
      Впервые за весь день ты чувствуешь себя в безопасности.
      Но спокойствие длится недолго.
      Посреди ночи тебя будит громкий треск веток.
      В следующую секунду на поляну вылетает огромный кабан.
      Ты резко вскакиваешь на ноги.
      И тут же понимаешь свою ошибку.
      Кабан замечает движение.
      Испуганное животное резко меняет направление и бросается прямо на тебя.

    choices:
      - id: 14
        text: "Бежать"
        nextStepId: 12

      - id: 15
        text: "Защищаться"
        nextStepId: 13

  - id: 12
    result: LOSE
    text: |
      Инстинкты берут верх.
      Ты разворачиваешься и бросаешься бежать.        
      Сделав всего несколько шагов, ты понимаешь свою ошибку.         
      Кабан намного быстрее.          
      Мощный удар в спину сбивает тебя с ног.        
      Земля резко уходит из-под ног.          
      Последнее, что ты слышишь — яростный визг разъярённого зверя.         
      Ты проиграла.

  - id: 13
    result: CONTINUE
    text: |
      Ты хватаешь догорающее полено и со всей силы бьёшь зверя по морде.
      Кабан визжит.
      Полено разлетается на щепки.
      В глаза животному летят искры и горячие угли.
      Кабан шарахается в сторону.
      Ты хватаешь второе полено.
      Ещё удар.
      Ещё...
      Тишина.
      Несколько секунд ты просто стоишь на месте, жадно вдыхая воздух, словно его вдруг стало меньше.
      Только сейчас ты понимаешь, что произошло: кабан больше не двигается.
      Запах крови обязательно привлечёт хищников.
      Из последних сил ты хватаешь кабана за задние ноги и начинаешь тащить его прочь от лагеря.
      Через несколько минут впереди мелькает знакомый силуэт.
      Пантера.
      Ты смотришь хищнику в глаза, потом на кабана.
      И вдруг понимаешь — скорее всего, это она его так напугала.
      Ты отпускаешь тушу и медленно отходишь назад.
      Затем разворачиваешься и спокойно возвращаешься к лагерю.
      Вслед тебе доносится рычание и треск веток...
      Сидя у костра, ты понимаешь, что уснуть уже не получится.
      Вдруг в темноте появляется знакомый силуэт.
      Пантера спокойно выходит к лагерю и ложится неподалёку от костра, положив голову на лапы.
      Ты неожиданно ловишь себя на мысли:
      возможно, это твой шанс подружиться с одним из самых опасных хищников джунглей.

    choices:
      - id: 17
        text: "Попробовать приблизиться"
        nextStepId: 14

      - id: 18
        text: "Остаться у костра"
        nextStepId: 15

  - id: 14
    result: LOSE
    text: |
      Медленно поднявшись, ты делаешь шаг к пантере.
      Затем ещё один.
      Хищник мгновенно поднимает голову.
      Жёлтые глаза внимательно следят за каждым твоим движением.
      Тебе кажется, что ещё немного — и ты сможешь приблизиться.
      Но пантера думает иначе.
      С недовольным рычанием она вскакивает на лапы и одним прыжком исчезает в темноте.
      Ты останавливаешься.
      И тут же чувствуешь резкую боль в ноге.
      Опустив взгляд, ты замечаешь стремительно уползающую змею.
      Похоже, в темноте ты наступила прямо на неё.
      Через несколько минут ноги начинают слабеть.
      Джунгли медленно расплываются перед глазами.
      Ты проиграла.

  - id: 15
    result: CONTINUE
    text: |
      Ты вспоминаешь всё, что когда-либо читала о кошках.
      Кажется, медленное моргание считается знаком доверия.
      Звучит глупо.
      Но почему бы не попробовать?
      Ты осторожно смотришь на пантеру и медленно закрываешь глаза.
      Затем открываешь их снова.
      Несколько секунд ничего не происходит.
      Пантера продолжает наблюдать за тобой.
      А потом тоже медленно моргает.
      Ты невольно улыбаешься.
      Похоже, это был не самый плохой совет.
      Усталость наконец берёт своё.
      Ты устраиваешься возле костра.
      Последнее, что ты видишь перед сном — мерцающую в отблесках костра спящую пантеру.

    choices:
      - id: 20
        text: "Уснуть"
        nextStepId: 16

  - id: 16
    result: CONTINUE
    text: |
      Проснувшись, ты первым делом смотришь туда, где ночью лежала пантера.
      Пусто.
      Несколько секунд тебе даже кажется, что всё произошедшее было сном.
      Ты подбрасываешь веток в костёр и доедаешь остатки сухпайка.
      Затем собираешь вещи и продолжаешь путь.
      Утренний лес выглядит совсем иначе.
      Солнечные лучи пробиваются сквозь густую листву.
      Птицы наполняют джунгли своими криками.
      Настроение становится немного лучше.
      Но спустя несколько часов ты понимаешь, что местность вокруг изменилась.
      Под ногами становится всё больше грязи.
      Каждый шаг даётся тяжелее предыдущего.
      Ты делаешь ещё один шаг.
      И вдруг проваливаешься по колено.
      Резко отдёрнув ногу, ты делаешь шаг назад.
      Слишком поздно.
      Земля под тобой начинает медленно расползаться.
      Болото.
      Ты стараешься не паниковать.
      Но с каждой секундой выбраться становится всё сложнее.

    choices:
      - id: 22
        text: "Продолжать вырываться"
        nextStepId: 17

      - id: 23
        text: "Остановиться и осмотреться"
        nextStepId: 18

  - id: 17
    result: LOSE
    text: |
      Паника берёт верх.
      Ты отчаянно пытаешься вырваться.
      Одной ногой.
      Потом другой.
      Но становится только хуже.
      Вязкая жижа всё сильнее затягивает тебя вниз.
      Сердце бешено колотится.
      Ты продолжаешь бороться до последнего.
      Но джунглям всё равно.
      Очень скоро силы заканчиваются.
      Болото медленно поглощает тебя.
      Твой путь окончен.
      Ты проиграла.

  - id: 18
    result: CONTINUE
    text: |
      Ты заставляешь себя остановиться.
      Паника сейчас только навредит.
      Сделав несколько глубоких вдохов, ты оглядываешься по сторонам.
      И вдруг замечаешь движение.
      В нескольких десятках метров от тебя стоит пантера.
      Наблюдает.
      Несколько секунд вы смотрите друг на друга.
      Затем пантера разворачивается и делает несколько шагов в сторону.
      Останавливается.
      И снова смотрит на тебя.
      Только сейчас ты замечаешь, что под ней твёрдая земля.
      Без грязи.
      Без трясины.
      Очень медленно ты переносишь вес тела.
      Затем ещё немного.
      Каждое движение даётся с трудом.
      Но постепенно болото отпускает тебя.
      Наконец ты выбираешься на твёрдую землю и без сил опускаешься на колени.
      Когда ты поднимаешь голову, пантера всё ещё ждёт неподалёку.
      Словно проверяя, всё ли с тобой в порядке.

    choices:
      - id: 25
        text: "Пойти за пантерой"
        nextStepId: 19

      - id: 26
        text: "Продолжить путь самостоятельно"
        nextStepId: 20

  - id: 20
    result: LOSE
    text: |
      Ты благодарно смотришь на пантеру.
      Затем поднимаешь рюкзак и продолжаешь путь.
      Теперь ты гораздо лучше понимаешь эти джунгли.
      Болото осталось позади, и кажется, ты скоро будешь в лагере.
      Сделав очередной шаг, ты вдруг проваливаешься вниз почти по грудь.
      Новая трясина.
      На этот раз гораздо глубже.
      Паника мгновенно возвращается.
      Ты пытаешься выбраться.
      Но чем сильнее сопротивляешься, тем глубже уходишь.
      В последний момент тебе кажется, будто на краю болота мелькает знакомый чёрный силуэт.
      Но теперь уже слишком поздно.
      Ты проиграла.

  - id: 19
    result: CONTINUE
    text: |
      Ты поднимаешься на ноги и смотришь на пантеру.
      Несколько секунд она неподвижно стоит среди деревьев.
      Затем разворачивается и уходит в заросли.
      Остановившись через несколько метров, пантера оглядывается.
      Словно проверяя, идёшь ли ты следом.
      Это выглядит настолько очевидно, что ты невольно улыбаешься.
      Возможно, ты совершаешь глупость.
      Но после всего произошедшего решаешь довериться ей.
      Несколько часов вы медленно продвигаетесь через джунгли.
      В какой-то момент ты начинаешь замечать, что идти стало легче.
      Земля становится суше.
      Густые заросли постепенно редеют.
      Внезапно пантера останавливается.
      Её шерсть вздыбливается.
      Из зарослей напротив доносится низкое рычание.
      Ягуар.
      Несколько секунд хищники смотрят друг на друга.
      Затем всё происходит мгновенно.
      Пантера бросается вперёд.
      Джунгли наполняются рычанием и треском веток.
      Огромные кошки сцепляются в смертельной схватке.
      Сначала кажется, что силы равны.
      Но вскоре становится ясно — ягуар крупнее.
      Один мощный удар лапы отбрасывает пантеру в сторону.
      Она поднимается.
      Снова бросается в бой.
      И снова оказывается на земле.
      Ты замечаешь кровь на её боку.
      Пантера тяжело дышит.
      Ещё немного — и бой будет проигран.

    choices:
      - id: 28
        text: "Защитить пантеру"
        nextStepId: 21

      - id: 29
        text: "Сбежать"
