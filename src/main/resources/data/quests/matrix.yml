id: 2
title: "Матрица: До Избранного"
description: |
  Морфеус ещё не нашёл Нео.
  Матрица кажется вечной.
  Машины контролируют людей страхом, надеждой и пророчествами.
  Но иногда систему ломает не Избранный.
  Иногда её ломает тот, кому есть что терять.

firstStepId: 1

steps:
  - id: 1
    result: CONTINUE
    text: |
      Экран заливает зелёный код.
      Морфеус стоит в тишине корабля и смотрит на бегущие строки.
      Сигнал появился всего на секунду.
      Слишком короткий.
      Слишком чистый.
      Кто-то внутри Матрицы увидел её такой, какой её видят машины.
      Ниоба стоит рядом.
      Ещё не капитан.
      Ещё не легенда.
      Просто женщина, которая смотрит на тебя слишком внимательно.
      — Ты опять ищешь призраков, Морфеус.
      Ты не отрываешь взгляда от экрана.
      — Нет. Я ищу того, кто однажды докажет, что призраки существуют.
    choices:
      - id: 1
        text: "Следовать за сигналом"
        nextStepId: 2
      - id: 2
        text: "Послушать Ниобу"
        nextStepId: 3

  - id: 2
    result: CONTINUE
    text: |
      Ты входишь в Матрицу.
      Город встречает тебя шумом машин, дождём и неоновым светом.
      Сигнал ведёт в старое здание на окраине.
      Всё слишком тихо.
      Это почти наверняка ловушка.
      Но вера редко приходит туда, где безопасно.
      Внутри здания ты находишь терминал.
      На экране мигает одно имя.
      THOMAS ANDERSON.
      Но рядом появляется ещё один файл.
      NIOBE.
      Машины почему-то следят за ней тоже.
    choices:
      - id: 3
        text: "Открыть файл Томаса Андерсона"
        nextStepId: 4
      - id: 4
        text: "Открыть файл Ниобы"
        nextStepId: 5

  - id: 3
    result: LOSE
    text: |
      Ты решаешь отступить.
      Ниоба молчит, но в её взгляде нет победы.
      Проходят годы.
      Матрица работает.
      Люди спят.
      Машины считают новый цикл успешным.
      Иногда ты просыпаешься среди ночи и вспоминаешь зелёный код на экране.
      Возможно, там действительно был ответ.
      Но ты выбрал тишину.
      Ты проиграл.

  - id: 4
    result: WIN
    text: |
      Ты открываешь файл Томаса Андерсона.
      Данных почти нет.
      Обычный человек.
      Обычная работа.
      Обычная жизнь.
      Но код вокруг его имени ведёт себя неправильно.
      Система словно не знает, что с ним делать.
      Ты улыбаешься.
      Теперь у тебя есть имя.
      Твоя миссия выполнена.
      Дальше начнётся история Нео.
      А тебе останется одиночество, вера и долгий путь к человеку, который ещё не знает, кем станет.
      Ты победил.

  - id: 5
    result: CONTINUE
    text: |
      Ты открываешь файл Ниобы.
      Сначала кажется, что это ошибка.
      Машины следят не за ней одной.
      Они следят за её сестрой.
      За детьми.
      За людьми, которых она каждый день видит в Матрице.
      У Ниобы есть то, чего давно нет у тебя.
      Ей есть что терять.
      Позади слышатся шаги агентов.
      Система проснулась.
      Ниоба смотрит на тебя.
      — Что ты нашёл?
      Ты впервые не знаешь, что ответить.
    choices:
      - id: 7
        text: "Скрыть правду и продолжить поиски Избранного"
        nextStepId: 6
      - id: 8
        text: "Рассказать Ниобе правду"
        nextStepId: 7

  - id: 6
    result: LOSE
    text: |
      Ты закрываешь файл.
      Пророчество важнее.
      Так ты говоришь себе.
      Так легче.
      Ниоба больше не задаёт вопросов.
      Но между вами появляется тишина, которую невозможно взломать.
      Через несколько дней сигнал Томаса Андерсона исчезает.
      Машины меняют маршруты.
      Меняют имена.
      Меняют судьбы.
      Ты всё ещё веришь.
      Но теперь вера похожа на пустую комнату.
      Ты проиграл.

  - id: 7
    result: CONTINUE
    text: |
      Ты рассказываешь Ниобе всё.
      Про файл.
      Про слежку.
      Про её семью.
      Она слушает молча.
      Потом медленно поднимает глаза.
      — Значит, они думают, что могут держать меня на поводке.
      Ты хочешь сказать что-то пафосное.
      Что-то про судьбу.
      Но Ниоба уже смотрит не на тебя.
      Она смотрит на код.
      Быстро.
      Холодно.
      Без страха.
      — Морфеус, ты всё это время искал одного человека.
      Она усмехается.
      — А надо было искать дыру в системе.
    choices:
      - id: 10
        text: "Довериться Ниобе"
        nextStepId: 8
      - id: 11
        text: "Остановить её"
        nextStepId: 9

  - id: 8
    result: WIN
    text: |
      Ниоба садится за терминал.
      Её пальцы бегут по клавишам так быстро, будто она всегда знала этот язык.
      Матрица сопротивляется.
      Код ломается.
      Агенты появляются слишком поздно.
      Ниоба не ищет Избранного.
      Она ищет тех, кого любит.
      И именно поэтому машины не могут просчитать её следующий шаг.
      Где-то в системе рушится целый сектор контроля.
      Ты смотришь на неё и впервые понимаешь:
      ты недооценил человека, который всё это время стоял рядом.
      Ниоба поворачивается к тебе.
      — Любовь — это не слабость, Морфеус.
      Экран вспыхивает белым.
      Матрица трещит по швам.
      Ты победил.

  - id: 9
    result: LOSE
    text: |
      Ты хватаешь Ниобу за руку.
      — Это слишком опасно.
      Она смотрит на тебя так, будто впервые видит по-настоящему.
      — Нет, Морфеус. Опасно ждать спасителя.
      Ты теряешь секунду.
      Этого достаточно.
      Агенты входят в комнату.
      Код схлопывается.
      Сигнал исчезает.
      Ниоба вырывает руку.
      Но уже поздно.
      Матрица снова становится гладкой, тихой и послушной.
      Ты проиграл.
